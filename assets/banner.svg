  <g transform="translate(60, 65)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#64748b" letter-spacing="4">AUTOMATIC SPEECH RECOGNITION</text>
    <rect x="0" y="8" width="40" height="2" fill="#00d9ff"/>
  </g>

  <text x="60" y="140" font-family="'Inter', sans-serif" font-size="56" font-weight="800" fill="url(#titleG)" letter-spacing="-1">WOLOF ASR</text>

